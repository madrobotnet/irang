<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Second Brain · Home empty · Mobile</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { width:390px; height:844px; overflow:hidden; background:#0a0810; font-family:var(--vn-font); }
  .device { width:390px; height:844px; background:var(--vn-canvas); color:var(--vn-text); display:flex; flex-direction:column; padding:14px 16px 0; position:relative; }
  .peek { position:absolute; top:96px; bottom:96px; width:8px; background:var(--vn-raised); opacity:.55; }
  .peek.l { left:0; border-radius:0 10px 10px 0; } .peek.r { right:0; border-radius:10px 0 0 10px; }
  .top3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; background:var(--vn-surface); border:1px solid var(--vn-hairline); border-radius:12px; padding:3px; margin:28px 0 18px; }
  .top3 span { display:flex; align-items:center; justify-content:center; height:40px; border-radius:9px; font-size:12px; color:var(--vn-text-meta); font-weight:500; }
  .top3 span.on { background:var(--vn-raised); color:var(--vn-text); font-weight:600; }
  .hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; padding:0 12px; }
  h1 { font-size:22px; font-weight:700; letter-spacing:-0.02em; }
  p { font-size:13px; font-weight:500; color:var(--vn-text-meta); line-height:1.5; max-width:280px; }
  .btn { margin-top:10px; height:48px; padding:0 28px; border:none; border-radius:14px; background:var(--vn-accent); color:var(--vn-accent-ink); font-size:15px; font-weight:700; }
  .pager { display:flex; gap:6px; justify-content:center; padding:20px 0 12px; }
  .pager i { width:6px; height:6px; border-radius:50%; background:var(--vn-text-meta); opacity:.45; display:block; }
  .pager i.on { width:18px; border-radius:4px; background:var(--vn-accent); opacity:1; }
  .tool { display:flex; gap:8px; padding:10px 0 18px; border-top:1px solid var(--vn-hairline); }
  .search { flex:1; height:44px; border-radius:22px; background:var(--vn-surface); border:1px solid var(--vn-hairline); display:flex; align-items:center; padding:0 14px; color:var(--vn-text-meta); font-size:14px; }
  .cap { height:44px; padding:0 16px; border:none; border-radius:14px; background:var(--vn-accent); color:var(--vn-accent-ink); font-size:14px; font-weight:700; }
</style>
</head>
<body>
  <div class="device">
    <div class="peek l"></div><div class="peek r"></div>
    <nav class="top3"><span>검색</span><span class="on">Inbox</span><span>AI 채팅</span></nav>
    <section class="hero">
      <h1>쌓인 캡처가 없어요</h1>
      <p>생각·링크·메모를 담아 두세요. 나중에 노트로 정리합니다.</p>
      <button class="btn" type="button">캡처</button>
    </section>
    <div class="pager"><i></i><i class="on"></i><i></i></div>
    <div class="tool"><div class="search">⌕  노트 검색</div><button class="cap" type="button">캡처</button></div>
  </div>
</body>
</html>
