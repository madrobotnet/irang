<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Second Brain · Home · Desktop</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body {
    width: 1440px; height: 900px; overflow: hidden;
    background: var(--vn-canvas);
    color: var(--vn-text);
    font-family: var(--vn-font);
    -webkit-font-smoothing: antialiased;
  }
  .app { width: 1440px; height: 900px; display: flex; flex-direction: column; }
  .topbar {
    height: 56px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px;
    border-bottom: 1px solid var(--vn-hairline);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(145deg, var(--vn-accent), #7c6bb8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .ghost {
    height: 36px; padding: 0 14px; border-radius: var(--vn-radius-ctl);
    background: transparent; color: var(--vn-text-secondary);
    border: 1px solid transparent; font-size: 13px; font-weight: 500;
  }
  .ghost.primary-quiet {
    color: var(--vn-accent); border-color: rgba(196,181,253,0.28);
    background: rgba(196,181,253,0.08);
  }
  .stage {
    flex: 1; display: flex; justify-content: center;
    padding: 24px 48px 36px;
    overflow: hidden;
  }
  .desk {
    width: 100%; max-width: 1240px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .top3 {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    background: var(--vn-surface);
    border: 1px solid var(--vn-hairline);
    border-radius: 14px;
    padding: 4px; gap: 4px;
  }
  .top3 a {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; border-radius: 10px;
    color: var(--vn-text-meta); text-decoration: none;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
  }
  .top3 a[aria-current="page"] {
    background: var(--vn-raised);
    color: var(--vn-text);
    font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--vn-radius-pill);
    background: var(--vn-accent); color: var(--vn-accent-ink);
    font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .hero-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; padding: 0 4px;
  }
  .hero-head h1 {
    font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.03em;
  }
  .hero-head h1 .count { color: var(--vn-accent); font-weight: 700; }
  .hero-head .hint {
    font-size: 13px; font-weight: 500; color: var(--vn-text-meta);
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid;
    grid-template-columns: 40px 1fr auto 28px;
    align-items: center; gap: 14px;
    min-height: 72px; padding: 14px 16px;
    background: var(--vn-surface);
    border: 1px solid var(--vn-hairline);
    border-radius: var(--vn-radius-row);
  }
  .row:hover { border-color: var(--vn-hairline-strong); background: #1f1a2a; }
  .ico {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--vn-raised);
    display: flex; align-items: center; justify-content: center;
    color: var(--vn-accent); font-size: 16px;
  }
  .body .title {
    font-size: 15px; line-height: 22px; font-weight: 600; letter-spacing: -0.015em;
    color: var(--vn-text);
  }
  .body .meta {
    margin-top: 3px;
    font-size: 12px; line-height: 18px; font-weight: 500;
    color: var(--vn-text-meta);
  }
  .meta .pill {
    display: inline-block; padding: 1px 7px; margin-right: 6px;
    border-radius: 6px; background: rgba(196,181,253,0.12);
    color: var(--vn-text-secondary); font-size: 11px; font-weight: 600;
  }
  .when {
    font-size: 12px; font-weight: 500; color: var(--vn-text-meta);
    white-space: nowrap; padding-right: 4px;
  }
  .chev { color: var(--vn-text-meta); font-size: 18px; opacity: 0.7; }
  .footer-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; margin-top: 6px; padding-top: 4px;
  }
  .btn-primary {
    height: 44px; padding: 0 22px; border: none; border-radius: 12px;
    background: var(--vn-accent); color: var(--vn-accent-ink);
    font-size: 14px; font-weight: 700; letter-spacing: -0.01em;
    box-shadow: 0 8px 24px rgba(196,181,253,0.18);
  }
  .continue {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: var(--vn-text-meta);
    text-decoration: none;
  }
  .continue strong { color: var(--vn-text-secondary); font-weight: 600; }
  .continue .more { color: var(--vn-accent); font-weight: 600; }

  .ico-doc::before, .ico-idea::before, .ico-link::before {
    content: ""; display: block; width: 16px; height: 16px;
  }
  .ico-doc::before {
    border: 1.5px solid var(--vn-accent); border-radius: 2px;
    box-shadow: inset 0 -6px 0 -5px var(--vn-accent);
  }
  .ico-idea::before {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid var(--vn-accent);
    box-shadow: 0 8px 0 -5px var(--vn-accent);
  }
  .ico-link::before {
    width: 12px; height: 8px; border: 1.5px solid var(--vn-accent);
    border-radius: 8px; transform: rotate(-35deg);
  }
  .hero-head { margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Second Brain</div>
      <div class="top-actions">
        <button class="ghost" type="button">오늘</button>
        <button class="ghost primary-quiet" type="button">캡처</button>
      </div>
    </header>
    <main class="stage">
      <div class="desk">
        <nav class="top3" aria-label="주요 이동">
          <a href="#">검색</a>
          <a href="#" aria-current="page">Inbox <span class="badge">3</span></a>
          <a href="#">AI 채팅</a>
        </nav>
        <div class="hero-head">
          <h1>미처리 · <span class="count">3</span></h1>
        </div>
        <div class="list" role="list">
          <div class="row" role="listitem">
            <div class="ico ico-doc" aria-hidden="true"></div>
            <div class="body">
              <div class="title">디자인 시스템 컬러 토큰 정리</div>
              <div class="meta"><span class="pill">클립</span>Figma 링크 · 본문 420자</div>
            </div>
            <div class="when">오늘 10:21</div>
            <div class="chev" aria-hidden="true">›</div>
          </div>
          <div class="row" role="listitem">
            <div class="ico ico-idea" aria-hidden="true"></div>
            <div class="body">
              <div class="title">Q2 사용자 인터뷰 인사이트</div>
              <div class="meta"><span class="pill">메모</span>태그 없음 · 미분류</div>
            </div>
            <div class="when">오늘 09:47</div>
            <div class="chev" aria-hidden="true">›</div>
          </div>
          <div class="row" role="listitem">
            <div class="ico ico-link" aria-hidden="true"></div>
            <div class="body">
              <div class="title">AI 에이전트 프롬프트 실험 노트</div>
              <div class="meta"><span class="pill">웹</span>arxiv 요약 붙여넣기</div>
            </div>
            <div class="when">어제 21:05</div>
            <div class="chev" aria-hidden="true">›</div>
          </div>
        </div>
        <div class="footer-row">
          <button class="btn-primary" type="button">정리</button>
          <a class="continue" href="#">이어서 · <strong>디자인 시스템 메모</strong> <span class="more">더 보기</span></a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
