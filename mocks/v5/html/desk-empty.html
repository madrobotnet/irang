<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Second Brain · Home empty · Desktop</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { width:1440px; height:900px; overflow:hidden; background:var(--vn-canvas); color:var(--vn-text); font-family:var(--vn-font); }
  .app { width:1440px; height:900px; display:flex; flex-direction:column; }
  .topbar { height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 40px; border-bottom:1px solid var(--vn-hairline); }
  .brand { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; }
  .brand-mark { width:22px; height:22px; border-radius:6px; background:linear-gradient(145deg,var(--vn-accent),#7c6bb8); }
  .ghost { height:36px; padding:0 14px; border-radius:10px; background:rgba(196,181,253,.08); color:var(--vn-accent); border:1px solid rgba(196,181,253,.28); font-size:13px; font-weight:500; }
  .stage { flex:1; display:flex; justify-content:center; padding:28px 40px 40px; }
  .desk { width:100%; max-width:1040px; display:flex; flex-direction:column; gap:22px; }
  .top3 { display:grid; grid-template-columns:1fr 1fr 1fr; background:var(--vn-surface); border:1px solid var(--vn-hairline); border-radius:14px; padding:4px; gap:4px; }
  .top3 a { display:flex; align-items:center; justify-content:center; height:44px; border-radius:10px; color:var(--vn-text-meta); text-decoration:none; font-size:14px; font-weight:500; }
  .top3 a[aria-current="page"] { background:var(--vn-raised); color:var(--vn-text); font-weight:600; }
  .empty {
    flex:1; min-height:420px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:12px;
    background: var(--vn-surface); border:1px solid var(--vn-hairline); border-radius:16px;
  }
  .empty h1 { font-size:22px; font-weight:700; letter-spacing:-0.02em; }
  .empty p { font-size:14px; font-weight:500; color:var(--vn-text-meta); max-width:360px; line-height:1.5; }
  .btn { margin-top:8px; height:44px; padding:0 28px; border:none; border-radius:12px; background:var(--vn-accent); color:var(--vn-accent-ink); font-size:14px; font-weight:700; }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>Second Brain</div>
      <button class="ghost" type="button">캡처</button>
    </header>
    <main class="stage"><div class="desk">
      <nav class="top3"><a href="#">검색</a><a href="#" aria-current="page">Inbox</a><a href="#">AI 채팅</a></nav>
      <div class="empty">
        <h1>쌓인 캡처가 없어요</h1>
        <p>생각·링크·메모를 먼저 담아 두세요. 나중에 Inbox에서 노트로 정리합니다.</p>
        <button class="btn" type="button">캡처</button>
      </div>
    </div></main>
  </div>
</body>
</html>
