<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, height=844" />
<title>Second Brain · Home · Mobile</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body {
    width: 390px; height: 844px; overflow: hidden;
    background: #0a0810;
    font-family: var(--vn-font);
    -webkit-font-smoothing: antialiased;
  }
  .device {
    position: relative; width: 390px; height: 844px;
    background: var(--vn-canvas); color: var(--vn-text);
    overflow: hidden;
  }
  /* adjacent pane peeks — gesture affordance, not stickers */
  .peek {
    position: absolute; top: 96px; bottom: 96px; width: 8px; z-index: 2;
    background: var(--vn-raised); opacity: 0.55;
  }
  .peek.left { left: 0; border-radius: 0 10px 10px 0; box-shadow: 2px 0 12px rgba(196,181,253,0.12); }
  .peek.right { right: 0; border-radius: 10px 0 0 10px; box-shadow: -2px 0 12px rgba(196,181,253,0.12); }
  .safe {
    position: relative; z-index: 1;
    height: 100%; display: flex; flex-direction: column;
    padding: 14px 16px 0;
  }
  .status {
    height: 18px; display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 600; color: var(--vn-text-secondary); opacity: 0.7;
    margin-bottom: 10px; padding: 0 4px;
  }
  .top3 {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
    background: var(--vn-surface); border: 1px solid var(--vn-hairline);
    border-radius: 12px; padding: 3px; margin-bottom: 18px;
  }
  .top3 span {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    height: 40px; border-radius: 9px;
    font-size: 12px; font-weight: 500; color: var(--vn-text-meta);
  }
  .top3 span.on {
    background: var(--vn-raised); color: var(--vn-text); font-weight: 600;
  }
  .badge {
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
    background: var(--vn-accent); color: var(--vn-accent-ink);
    font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .hero { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  h1 {
    font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.03em;
    margin-bottom: 4px; padding: 0 2px;
  }
  h1 em { color: var(--vn-accent); font-style: normal; }
  .sub {
    font-size: 12px; font-weight: 500; color: var(--vn-text-meta);
    margin-bottom: 14px; padding: 0 2px;
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid; grid-template-columns: 36px 1fr 16px;
    gap: 10px; align-items: center;
    min-height: 64px; padding: 12px;
    background: var(--vn-surface); border: 1px solid var(--vn-hairline);
    border-radius: 12px;
  }
  .ico {
    width: 36px; height: 36px; border-radius: 9px; background: var(--vn-raised);
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .title { font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: -0.015em; }
  .meta { margin-top: 2px; font-size: 11px; line-height: 16px; font-weight: 500; color: var(--vn-text-meta); }
  .chev { color: var(--vn-text-meta); font-size: 16px; }
  .btn {
    margin-top: 14px; width: 100%; height: 48px; border: none; border-radius: 14px;
    background: var(--vn-accent); color: var(--vn-accent-ink);
    font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
  }
  .continue {
    margin-top: 12px; text-align: center;
    font-size: 12px; font-weight: 500; color: var(--vn-text-meta);
  }
  .continue strong { color: var(--vn-text-secondary); font-weight: 600; }
  /* page indicator = real pager affordance */
  .pager {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    padding: 12px 0 4px;
  }
  .pager i {
    display: block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--vn-text-meta); opacity: 0.45;
  }
  .pager i.on {
    width: 18px; border-radius: 4px; background: var(--vn-accent); opacity: 1;
  }
  .tool {
    flex: 0 0 auto;
    display: flex; gap: 8px; align-items: center;
    padding: 10px 0 18px;
    border-top: 1px solid var(--vn-hairline);
    background: linear-gradient(180deg, transparent, rgba(17,14,22,0.9) 30%);
  }
  .search {
    flex: 1; height: 44px; border-radius: 22px;
    background: var(--vn-surface); border: 1px solid var(--vn-hairline);
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px; color: var(--vn-text-meta); font-size: 14px; font-weight: 500;
  }
  .cap {
    height: 44px; padding: 0 16px; border: none; border-radius: 14px;
    background: var(--vn-accent); color: var(--vn-accent-ink);
    font-size: 14px; font-weight: 700;
  }

  .ico { position: relative; }
  .ico-doc::before, .ico-idea::before, .ico-link::before {
    content:""; display:block; margin:auto;
  }
  .ico-doc::before {
    width:14px; height:14px; border:1.5px solid var(--vn-accent); border-radius:2px;
    box-shadow: inset 0 -5px 0 -4px var(--vn-accent);
  }
  .ico-idea::before {
    width:9px; height:9px; border-radius:50%; border:1.5px solid var(--vn-accent);
    box-shadow: 0 7px 0 -4px var(--vn-accent);
  }
  .ico-link::before {
    width:11px; height:7px; border:1.5px solid var(--vn-accent);
    border-radius:7px; transform: rotate(-35deg);
  }
  .list { margin-top: 12px; }
</style>
</head>
<body>
  <div class="device">
    <div class="peek left" aria-hidden="true"></div>
    <div class="peek right" aria-hidden="true"></div>
    <div class="safe">
      <div class="status"><span>9:41</span><span>LTE</span></div>
      <nav class="top3" aria-label="주요 이동">
        <span>검색</span>
        <span class="on">Inbox <i class="badge">3</i></span>
        <span>AI 채팅</span>
      </nav>
      <section class="hero">
        <h1>미처리 · <em>3</em></h1>
        <div class="list">
          <div class="row">
            <div class="ico ico-doc"></div>
            <div>
              <div class="title">디자인 시스템 컬러 토큰 정리</div>
              <div class="meta">클립 · 오늘 10:21</div>
            </div>
            <div class="chev">›</div>
          </div>
          <div class="row">
            <div class="ico ico-idea"></div>
            <div>
              <div class="title">Q2 사용자 인터뷰 인사이트</div>
              <div class="meta">메모 · 오늘 09:47</div>
            </div>
            <div class="chev">›</div>
          </div>
          <div class="row">
            <div class="ico ico-link"></div>
            <div>
              <div class="title">AI 에이전트 프롬프트 실험</div>
              <div class="meta">웹 · 어제 21:05</div>
            </div>
            <div class="chev">›</div>
          </div>
        </div>
        <button class="btn" type="button">정리</button>
        <div class="continue">이어서 · <strong>디자인 시스템 메모</strong> · 더 보기</div>
        <div class="pager" aria-label="화면 위치"><i></i><i class="on"></i><i></i></div>
      </section>
      <div class="tool">
        <div class="search">⌕  노트 검색</div>
        <button class="cap" type="button">캡처</button>
      </div>
    </div>
  </div>
</body>
</html>
