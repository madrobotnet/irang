<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>세컨드 브레인 · 검색 빈 결과 — desk-a</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../shell.css" />

</head>
<body>

<div class="app-d" role="application" aria-label="세컨드 브레인 검색 빈 결과">
  <nav class="rail" aria-label="유틸 레일">
    <div class="mark" aria-hidden="true">SB</div>
    <button type="button"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg><span>홈</span></button>
    <button class="active" aria-current="page" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>검색</span></button>
    <button type="button"><svg viewBox="0 0 24 24"><path d="M5 6h14v13H5z"/><path d="M9 6V4h6v2"/></svg><span>수집</span></button>
    <button type="button"><svg viewBox="0 0 24 24"><path d="M5 18V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 4z"/></svg><span>채팅</span></button>
    <button type="button"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2.2"/><circle cx="17" cy="7" r="2.2"/><circle cx="12" cy="16" r="2.2"/><path d="M8.8 9.5 15 8.2M8.5 9.8l2.8 5M15.2 8.6l-2.4 5.4"/></svg><span>관계</span></button>
    <div class="spacer"></div>
    <button class="settings" type="button" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.9 6.3l1.6 1.6M17.5 16.1l1.6 1.6M3 12h2.2M18.8 12H21M4.9 17.7l1.6-1.6M17.5 7.9l1.6-1.6"/></svg></button>
    <div class="avatar" aria-hidden="true"></div>
  </nav>
  <div class="main-d tight" style="display:flex;flex-direction:column">
    <section class="cmd-surface" aria-label="검색 커맨드">
      <div class="cmd-row">
        <div class="search-bar" role="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <div class="q filled">양자 암호 키 교환</div>
          <span class="kbd">Esc</span>
        </div>
        <button class="filter-btn" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg> 필터</button>
      </div>
      <div class="meta-row"><span class="pill">결과 0</span><span>범위 · 전체</span></div>
    </section>
    <section class="panel" style="flex:1" aria-label="빈 결과">
      <div class="empty">
        <div class="glyph"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
        <h3>맞는 결과가 없어요</h3>
        <p>다른 키워드를 쓰거나, 웹에서 새로 캡처한 뒤 다시 검색해 보세요.</p>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" type="button">검색어 지우기</button>
          <button class="btn btn-primary" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> 캡처하기</button>
        </div>
      </div>
    </section>
  </div>
</div>

</body>
</html>
