<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>세컨드 브레인 · 관계 지도 — desk-a</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../shell.css" />
<style>
.graph-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;flex:1;min-height:0}
.map-svg{width:100%;height:100%;display:block}
.node-label{font-family:var(--font);font-size:12px;font-weight:600;fill:#1c1917}
.node-meta{font-family:var(--font);font-size:10px;fill:#78716c}
.inspector{padding:18px;display:flex;flex-direction:column;gap:14px}
.inspector h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
.inspector .links{display:flex;flex-direction:column;gap:8px}
.link-row{padding:10px 12px;border-radius:10px;background:var(--desk);font-size:12px;font-weight:600}
.link-row .m{font-weight:500;color:var(--mute);margin-top:3px}
</style>
</head>
<body>

<div class="app-d" role="application" aria-label="세컨드 브레인 관계 지도">
  <nav class="rail" aria-label="유틸 레일">
    <div class="mark" aria-hidden="true">SB</div>
    <button type="button"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg><span>홈</span></button>
    <button type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>검색</span></button>
    <button type="button"><svg viewBox="0 0 24 24"><path d="M5 6h14v13H5z"/><path d="M9 6V4h6v2"/></svg><span>수집</span></button>
    <button type="button"><svg viewBox="0 0 24 24"><path d="M5 18V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 4z"/></svg><span>채팅</span></button>
    <button class="active" aria-current="page" type="button"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2.2"/><circle cx="17" cy="7" r="2.2"/><circle cx="12" cy="16" r="2.2"/><path d="M8.8 9.5 15 8.2M8.5 9.8l2.8 5M15.2 8.6l-2.4 5.4"/></svg><span>관계</span></button>
    <div class="spacer"></div>
    <button class="settings" type="button" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.9 6.3l1.6 1.6M17.5 16.1l1.6 1.6M3 12h2.2M18.8 12H21M4.9 17.7l1.6-1.6M17.5 7.9l1.6-1.6"/></svg></button>
    <div class="avatar" aria-hidden="true"></div>
  </nav>
  <main class="main-d tight">
    <header class="topbar" style="margin-bottom:14px">
      <div class="greet"><div class="eyebrow">지식 지도 · 2D</div><h1 style="font-size:22px">관계</h1></div>
      <div class="top-actions">
        <button class="btn" type="button">허브만</button>
        <button class="btn" type="button">이번 주</button>
        <button class="btn btn-primary" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> 지도에서 찾기</button>
      </div>
    </header>
    <div class="graph-layout">
      <div class="map-wrap" aria-label="지식 지도 캔버스">
        <div class="map-hud">
          <div class="map-legend">
            <span><i style="background:#c45c26"></i>선택</span>
            <span><i style="background:#3d5a80"></i>노트</span>
            <span><i style="background:#6b705c"></i>메모</span>
            <span><i style="background:#9a3412"></i>클립</span>
          </div>
          <div class="map-legend">
            <span>줌 · 100%</span>
            <span>노드 8 · 연결 9</span>
          </div>
        </div>
        <svg class="map-svg" viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="지식 지도">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffcf7"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e7e0d4" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="980" height="720" fill="url(#bg)"/>
  <rect width="980" height="720" fill="url(#grid)"/>
  <g><line x1="412" y1="274" x2="666" y2="202" stroke="#d6cec0" stroke-width="1.5"/><line x1="412" y1="274" x2="706" y2="396" stroke="#d6cec0" stroke-width="1.5"/><line x1="412" y1="274" x2="490" y2="130" stroke="#d6cec0" stroke-width="1.5"/><line x1="412" y1="274" x2="216" y2="396" stroke="#d6cec0" stroke-width="1.5"/><line x1="216" y1="396" x2="274" y2="158" stroke="#d6cec0" stroke-width="1.5"/><line x1="412" y1="274" x2="539" y2="518" stroke="#d6cec0" stroke-width="1.5"/><line x1="274" y1="158" x2="176" y2="274" stroke="#d6cec0" stroke-width="1.5"/><line x1="706" y1="396" x2="539" y2="518" stroke="#d6cec0" stroke-width="1.5"/><line x1="666" y1="202" x2="490" y2="130" stroke="#d6cec0" stroke-width="1.5"/></g>
  <g><circle cx="412" cy="274" r="33" fill="none" stroke="#c45c26" stroke-width="2" opacity="0.45"/>
      <circle cx="412" cy="274" r="28" fill="#c45c26" opacity="0.92"/>
      <circle cx="412" cy="274" r="28" fill="url(#shine)" opacity="0.25"/>
      <text class="node-label" x="412" y="318" text-anchor="middle">디자인 토큰</text>
      <text class="node-meta" x="412" y="330" text-anchor="middle">노트 · 허브</text>
      <circle cx="666" cy="202" r="20" fill="#3d5a80" opacity="0.92"/>
      <circle cx="666" cy="202" r="20" fill="url(#shine)" opacity="0.25"/>
      <text class="node-label" x="666" y="238" text-anchor="middle">타이포</text>
      <text class="node-meta" x="666" y="250" text-anchor="middle">메모</text>
      <circle cx="706" cy="396" r="18" fill="#9a3412" opacity="0.92"/>
      <circle cx="706" cy="396" r="18" fill="url(#shine)" opacity="0.25"/>
      <text class="node-label" x="706" y="430" text-anchor="middle">매트 vs 글래스</text>
      <text class="node-meta" x="706" y="442" text-anchor="middle">클립</text>
      <circle cx="216" cy="396" r="22" fill="#6b705c" opacity="0.92"/>
      <circle cx="216" cy="396" r="22" fill="url(#shine)" opacity="0.25"/>
      <text class="node-label" x="216" y="434" text-anchor="middle">Q2 인터뷰</text>
      <text class="node-meta" x="216" y="446" text-anchor="middle">메모</text>
      <circle cx="539" cy="518" r="18" fill="#9a3412" opacity="0.92"/>
      <circle cx="539" cy="518" r="18" fill="url(#shine)" opacity="0.25"/>
      <text class="node-label" x="539" y="552" text-anchor="middle">프롬프트 로그</text>
      <text class="node-meta" x="539" y="564" text-anchor="middle">클립</text>
      <circle cx="274" cy="158" r="16" fill="#57534e" opacity="0.92"/>
      <circle cx="274" cy="158" r="16" fill="url(#shine)" opacity="0.25"/>
      <text class="node-label" x="274" y="190" text-anchor="middle">주간 리뷰</text>
      <text class="node-meta" x="274" y="202" text-anchor="middle">채팅</text>
      <circle cx="490" cy="130" r="14" fill="#7c6a4a" opacity="0.92"/>
      <circle cx="490" cy="130" r="14" fill="url(#shine)" opacity="0.25"/>
      <text class="node-label" x="490" y="160" text-anchor="middle">대비 7:1</text>
      <text class="node-meta" x="490" y="172" text-anchor="middle">태그</text>
      <circle cx="176" cy="274" r="14" fill="#78716c" opacity="0.92"/>
      <circle cx="176" cy="274" r="14" fill="url(#shine)" opacity="0.25"/>
      <text class="node-label" x="176" y="304" text-anchor="middle">수집 패턴</text>
      <text class="node-meta" x="176" y="316" text-anchor="middle">관계</text></g>
</svg>
      </div>
      <aside class="panel inspector" aria-label="선택 노드">
        <span class="badge">허브 · 노트</span>
        <h3>디자인 토큰</h3>
        <p style="font-size:13px;color:var(--mute);line-height:1.5">캔버스·데스크·카드 3층과 terracotta CTA 규칙을 묶는 중심 노드.</p>
        <div>
          <div class="panel-head" style="margin-bottom:8px"><h2 class="sm">연결된 항목</h2><span class="count">5</span></div>
          <div class="links">
            <div class="link-row">타이포 스케일<div class="m">메모 · 관련도 높음</div></div>
            <div class="link-row">매트 vs 글래스<div class="m">클립 · 재질 가이드</div></div>
            <div class="link-row">대비 7:1<div class="m">태그 · 접근성</div></div>
            <div class="link-row">Q2 인터뷰<div class="m">메모 · 검색 우선</div></div>
            <div class="link-row">프롬프트 로그<div class="m">클립 · 실험</div></div>
          </div>
        </div>
        <button class="btn btn-primary" type="button" style="width:100%;justify-content:center;margin-top:auto">노트 열기</button>
      </aside>
    </div>
  </main>
</div>

</body>
</html>
