services:
  traefik:
    image: traefik:v3
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/letsencrypt

  web:
    environment:
      BRAIN_COOKIE_SECURE: "true"
      BRAIN_TRUST_PROXY: "true"
    labels:
      traefik.enable: "true"
      traefik.http.routers.brain.rule: "Host(`${BRAIN_HOST:?set BRAIN_HOST}`)"
      traefik.http.routers.brain.entrypoints: websecure
      traefik.http.routers.brain.tls: "true"
      traefik.http.routers.brain.tls.certresolver: le
      traefik.http.services.brain.loadbalancer.server.port: "3000"

volumes:
  acme:
