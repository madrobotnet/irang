[extend]
useDefault = true

# The installed-app OAuth client ships publicly in the pinned Gemini CLI:
# https://github.com/google-gemini/gemini-cli/blob/v0.61.0/packages/core/src/code_assist/oauth2.ts
# Exempt only that exact published constant in its adapter. Private tokens or
# any replacement secret in this file must still fail the scan.
[[allowlists]]
description = "Published Gemini CLI installed-app OAuth constant"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)src/server/ai-auth/google\.ts$''']
regexTarget = "secret"
regexes = ['''^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$''']

# Only this published, self-signed TLS fixture is exempt. Other keys in the
# same test file must still fail the scan.
[[allowlists]]
description = "Public capture.example TLS test key"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)src/server/inbox/url\.test\.ts$''']
regexes = ['''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQglZBfaxApoc\+ieP5W\s+ZHkS8dkayROGpmCHD8hI7e4V7y2hRANCAAR8o/CrYnDIaDnmxWqveLMw3hbaISf\+\s+4vpgKreOiSWgVvR15CtlLmEu8MHNveXU5B3xqoZLUkUGAOuiuTVPE6Jo''']
