condition = "AND"
paths = ['''(^|/)src/server/inbox/url\.test\.ts$''']
regexes = ['''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQglZBfaxApoc\+ieP5W\s+ZHkS8dkayROGpmCHD8hI7e4V7y2hRANCAAR8o/CrYnDIaDnmxWqveLMw3hbaISf\+\s+4vpgKreOiSWgVvR15CtlLmEu8MHNveXU5B3xqoZLUkUGAOuiuTVPE6Jo''']
